name: Build

on:
  push:
    branches: [main, "overhaul/**"]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Accepts the SDK licenses; AGP then downloads the compile SDK (Android 17,
      # API 37) itself. The action's default package list still names the
      # long-removed "tools" package, so name one explicitly.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        run: ./gradlew testDebugUnitTest --console=plain
      - name: Build release APK
        run: ./gradlew assembleRelease --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: DuoGlass-apk
          path: app/build/outputs/apk/release/app-release.apk
